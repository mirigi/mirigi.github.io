---
<meta name="mirigi-signup-endpoint" content="{{ site.building_signup_endpoint }}">

<style>
  :root { --ink: #f2efe9; --muted: rgba(242,239,233,.66); --gold: #c9a961; --panel: rgba(242,239,233,.045); --line: rgba(201,169,97,.22); --field: rgba(242,239,233,.06); }
  body { background: #100e0c; color: var(--ink); }
  .signup { position: relative; min-height: 100vh; max-width: 1120px; margin: 0 auto; padding: 4.5rem clamp(1rem, 4vw, 4rem) 7rem; box-sizing: border-box; }
  .signup::before { content: 'MIRIGI  /  BUILDING SETUP'; display: block; color: var(--gold); font-size: .7rem; letter-spacing: .22em; margin-bottom: 1rem; }
  .signup[data-lang="es"]::before { content: 'MIRIGI  /  CONFIGURACIÓN DEL EDIFICIO'; }
  .signup h1 { font-family: 'DM Serif Display', Georgia, serif; font-weight: 400; font-size: clamp(2.2rem, 5vw, 4rem); line-height: 1; letter-spacing: -.02em; margin: 0 0 .8rem; }
  .signup .lead { max-width: 660px; color: var(--muted); font-size: 1rem; line-height: 1.6; margin: 0 0 1.6rem; }
  .langswitch { position: absolute; top: 1.3rem; right: clamp(1rem, 4vw, 4rem); display: flex; gap: .4rem; }
  .langswitch button { background: transparent; border: 1px solid rgba(201,169,97,.4); color: var(--muted); padding: .3rem .85rem; border-radius: 999px; font-size: .75rem; letter-spacing: .08em; cursor: pointer; }
  .langswitch button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #100e0c; }

  .stepper { position: sticky; top: 0; z-index: 20; display: flex; gap: .4rem; flex-wrap: wrap; padding: .7rem 0; margin-bottom: 1rem; background: linear-gradient(#100e0c 75%, rgba(16,14,12,0)); }
  .stepper a { display: inline-flex; align-items: center; gap: .5rem; padding: .45rem .9rem; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); text-decoration: none; font-size: .78rem; letter-spacing: .04em; background: #14110e; }
  .stepper a:hover { color: var(--ink); border-color: var(--gold); }
  .stepper .dot { width: .55rem; height: .55rem; border-radius: 50%; border: 1px solid var(--gold); }
  .stepper a.done .dot { background: var(--gold); }

  .card { scroll-margin-top: 4.2rem; margin: 1.1rem 0; padding: clamp(1.1rem, 3vw, 2rem); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .card .num { color: var(--gold); font-size: .68rem; letter-spacing: .2em; }
  .card h2 { font-family: 'DM Serif Display', Georgia, serif; font-weight: 400; font-size: 1.7rem; margin: .25rem 0 .4rem; }
  .card h3 { font-size: 1.02rem; font-weight: 600; margin: 1.8rem 0 .3rem; }
  .card .intro { color: var(--muted); font-size: .92rem; line-height: 1.55; margin: 0 0 1rem; max-width: 720px; }
  .hint { color: var(--muted); font-size: .8rem; line-height: 1.45; margin: .15rem 0 .5rem; }

  .field { margin: .9rem 0; }
  .field > label, .label { display: block; margin: 0 0 .35rem; color: var(--muted); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; }
  .req { color: var(--gold); }
  .signup input[type=text], .signup input[type=email], .signup input[type=tel], .signup input[type=number], .signup input[type=time], .signup select, .signup textarea {
    box-sizing: border-box; width: 100%; padding: .65rem .75rem; background: var(--field); color: var(--ink); border: 1px solid rgba(242,239,233,.16); border-radius: 6px; font: inherit; font-size: .92rem; }
  .signup select option { background: #1b1814; color: var(--ink); }
  .signup input:focus, .signup select:focus, .signup textarea:focus { outline: none; border-color: var(--gold); background: rgba(242,239,233,.09); }
  .signup textarea { min-height: 84px; resize: vertical; }
  .signup ::placeholder { color: rgba(242,239,233,.34); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 0 1rem; }
  .grid > .field { display: flex; flex-direction: column; justify-content: flex-end; }

  .chips { display: flex; flex-wrap: wrap; gap: .45rem; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
  .chip span { display: inline-block; padding: .5rem 1rem; border: 1px solid rgba(242,239,233,.2); border-radius: 999px; color: var(--muted); font-size: .85rem; transition: .15s; }
  .chip input:checked + span { background: var(--gold); border-color: var(--gold); color: #100e0c; font-weight: 600; }
  .chip input:focus-visible + span { outline: 2px solid var(--gold); outline-offset: 2px; }

  .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .7rem .9rem; margin: .5rem 0; border: 1px solid rgba(242,239,233,.12); border-radius: 8px; background: rgba(0,0,0,.14); }
  .switch-row .txt { color: var(--ink); font-size: .92rem; }
  .switch { position: relative; flex: none; width: 2.7rem; height: 1.5rem; }
  .switch input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 2; }
  .switch .track { position: absolute; inset: 0; border-radius: 999px; background: rgba(242,239,233,.2); transition: .15s; }
  .switch .track::after { content: ''; position: absolute; top: .18rem; left: .18rem; width: 1.14rem; height: 1.14rem; border-radius: 50%; background: #f2efe9; transition: .15s; }
  .switch input:checked ~ .track { background: var(--gold); }
  .switch input:checked ~ .track::after { transform: translateX(1.2rem); background: #100e0c; }
  .switch input:focus-visible ~ .track { outline: 2px solid var(--gold); outline-offset: 2px; }

  .tbl { width: 100%; border-collapse: separate; border-spacing: 0 .4rem; }
  .tbl th { text-align: left; color: var(--muted); font-size: .66rem; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; padding: 0 .4rem .2rem; white-space: nowrap; }
  .tbl td { padding: 0 .4rem 0 0; vertical-align: middle; }
  .tbl td.act { width: 2.4rem; padding: 0; text-align: right; }
  .x { width: 2rem; height: 2rem; border-radius: 50%; border: 1px solid rgba(242,239,233,.2); background: transparent; color: var(--muted); font-size: 1.1rem; line-height: 1; cursor: pointer; }
  .x:hover { color: #ff9b8f; border-color: #ff9b8f; }
  .add { margin-top: .5rem; background: transparent; color: var(--gold); border: 1px dashed rgba(201,169,97,.55); border-radius: 8px; padding: .55rem 1rem; font-size: .85rem; cursor: pointer; }
  .add:hover { background: rgba(201,169,97,.1); }
  .tblwrap { overflow-x: auto; }

  .item { margin: .8rem 0; padding: 1rem 1.1rem; border: 1px solid rgba(242,239,233,.12); border-radius: 8px; background: rgba(0,0,0,.16); }
  .item-head { display: flex; align-items: center; justify-content: space-between; gap: .8rem; margin-bottom: .3rem; }
  .item-head .ttl { color: var(--gold); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; }
  details.more { margin-top: .6rem; }
  details.more summary { cursor: pointer; color: var(--gold); font-size: .85rem; }

  .modules { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: .9rem; align-items: start; margin-top: 1rem; }
  .module { border: 1px solid rgba(242,239,233,.14); border-radius: 10px; background: rgba(0,0,0,.18); overflow: hidden; transition: border-color .15s; }
  .module.on { border-color: var(--gold); background: rgba(201,169,97,.06); grid-column: 1 / -1; }
  .module-head { display: flex; align-items: center; gap: .8rem; padding: .85rem 1rem; }
  .module-head .ico { flex: none; width: 2.3rem; height: 2.3rem; display: grid; place-items: center; border-radius: 8px; background: rgba(201,169,97,.12); color: var(--gold); }
  .module-head .ico svg { width: 1.2rem; height: 1.2rem; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .module-head .name { flex: 1; font-weight: 600; font-size: .98rem; }
  .info { flex: none; width: 1.45rem; height: 1.45rem; border-radius: 50%; border: 1px solid rgba(242,239,233,.35); background: transparent; color: var(--muted); font: italic 700 .8rem Georgia, serif; line-height: 1; cursor: pointer; padding: 0; }
  .info:hover, .info[aria-expanded="true"] { color: #100e0c; background: var(--gold); border-color: var(--gold); }
  .info-pop { margin: 0 1rem .8rem; padding: .7rem .85rem; border-left: 2px solid var(--gold); background: rgba(242,239,233,.05); color: var(--muted); font-size: .84rem; line-height: 1.5; }
  .module-body { padding: .2rem 1rem 1.1rem; border-top: 1px solid rgba(201,169,97,.25); }

  .actions { display: flex; flex-wrap: wrap; gap: .7rem; align-items: center; margin-top: 1.6rem; }
  .actions button { padding: .8rem 1.5rem; border-radius: 6px; border: 1px solid var(--gold); background: var(--gold); color: #100e0c; font-weight: 600; cursor: pointer; font-size: .92rem; }
  .actions button.secondary { background: transparent; color: var(--gold); }
  #savedVersions { display: flex; flex-wrap: wrap; gap: .4rem; width: 100%; }
  #savedVersions button { padding: .4rem .8rem; font-size: .74rem; font-weight: 400; }
  .status { color: var(--muted); width: 100%; margin: .3rem 0 0; min-height: 1.3em; }
  .privacy { color: var(--muted); font-size: .82rem; line-height: 1.5; margin-top: 1.4rem; }

  @media (max-width: 760px) {
    .stepper { flex-wrap: nowrap; overflow-x: auto; }
    .stepper a { flex: none; white-space: nowrap; }
    .tbl thead { display: none; }
    .tbl, .tbl tbody, .tbl tr, .tbl td { display: block; width: 100%; box-sizing: border-box; }
    .tbl tr { position: relative; margin: 0 0 .7rem; padding: 2.5rem .8rem .6rem; border: 1px solid rgba(242,239,233,.12); border-radius: 8px; background: rgba(0,0,0,.16); }
    .tbl td { padding: 0 0 .5rem; }
    .tbl td::before { content: attr(data-label); display: block; margin-bottom: .2rem; color: var(--muted); font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; }
    .tbl td.act { position: absolute; top: .4rem; right: .5rem; width: auto; padding: 0; }
    .tbl td.act::before { display: none; }
    .langswitch { position: static; margin-bottom: 1rem; }
  }
</style>

<main class="signup" data-lang="en">
  <div class="langswitch" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true">English</button><button type="button" data-lang="es" aria-pressed="false">Español</button></div>
  <h1 id="pageTitle">Mirigi Building Setup</h1>
  <p class="lead" id="pageLead"></p>
  <nav class="stepper" id="stepper" aria-label="Sections"></nav>

  <form id="signupForm" novalidate>
    <div id="formRoot"></div>
    <p class="privacy" id="privacyNote"></p>
    <input type="text" name="company_url" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;">
    <div class="actions">
      <button type="button" id="saveButton"></button>
      <button type="submit" id="sendButton"></button>
      <button type="button" id="linkButton" class="secondary" hidden></button>
      <div id="savedVersions"></div>
      <p class="status" id="status" role="status"></p>
    </div>
  </form>
</main>
<script>
(() => {
  'use strict';
  // ---------- Language helpers: every text is [English, Spanish] ----------
  let lang = 'en';
  const L = (en, es) => [en, es];
  const T = x => Array.isArray(x) ? x[lang === 'es' ? 1 : 0] : x;

  const LANG_OPTIONS = [['en', 'English'], ['es', 'Español'], ['pt', 'Português'], ['ru', 'Русский']];
  // Staff roles of the Mirigi platform (STAFF_ROLES in the backend).
  const ROLE_OPTIONS = [
    ['administrator', L('Administrator', 'Administrador')], ['amenities', L('Amenities', 'Amenities')],
    ['amenities_manager', L('Amenities manager', 'Responsable de amenities')], ['concierge', L('Concierge', 'Conserje')],
    ['delivery', L('Deliveries', 'Entregas')], ['engineer', L('Engineer', 'Ingeniero')],
    ['front_desk', L('Front desk', 'Recepción')], ['housekeeping', L('Housekeeping', 'Limpieza')],
    ['housekeeping_manager', L('Housekeeping manager', 'Responsable de limpieza')], ['maintenance', L('Maintenance', 'Mantenimiento')],
    ['manager', L('Manager', 'Gerente')], ['manager_assistant', L('Manager assistant', 'Asistente de gerencia')],
    ['marketing', L('Marketing', 'Marketing')], ['restaurant', L('Restaurant', 'Restaurante')],
    ['security', L('Security', 'Seguridad')], ['support', L('Support', 'Soporte')],
    ['valet', L('Valet', 'Valet')], ['valet_manager', L('Valet manager', 'Responsable de valet')],
    ['warrantor', L('Warrantor', 'Garante')]
  ];
  const DAY_OPTIONS = [['mon', L('Mon', 'Lun')], ['tue', L('Tue', 'Mar')], ['wed', L('Wed', 'Mié')], ['thu', L('Thu', 'Jue')], ['fri', L('Fri', 'Vie')], ['sat', L('Sat', 'Sáb')], ['sun', L('Sun', 'Dom')]];
  const COURIER_OPTIONS = ['FedEx', 'UPS', 'USPS', 'DHL', 'Amazon', 'Mercado Libre', 'Correo Uruguayo'].map(c => [c, c]);
  const CURRENCY_OPTIONS = [['USD', L('US dollar (USD)', 'Dólar estadounidense (USD)')], ['UYU', L('Uruguayan peso (UYU)', 'Peso uruguayo (UYU)')], ['EUR', L('Euro (EUR)', 'Euro (EUR)')], ['BRL', L('Brazilian real (BRL)', 'Real brasileño (BRL)')], ['ARS', L('Argentine peso (ARS)', 'Peso argentino (ARS)')], ['other', L('Other', 'Otra')]];
  const YES_NO_UNSURE = [['no', L('No', 'No')], ['yes', L('Yes', 'Sí')], ['unknown', L('Not sure', 'No sé')]];

  // ---------- Field builders ----------
  const f = {
    text: (key, label, o = {}) => Object.assign({ type: 'text', key, label }, o),
    area: (key, label, o = {}) => Object.assign({ type: 'textarea', key, label }, o),
    select: (key, label, options, o = {}) => Object.assign({ type: 'select', key, label, options }, o),
    chips: (key, label, options, o = {}) => Object.assign({ type: 'chips', key, label, options }, o),
    sw: (key, label, o = {}) => Object.assign({ type: 'switch', key, label }, o),
    table: (key, label, columns, o = {}) => Object.assign({ type: 'table', key, label, columns }, o),
    cards: (key, label, fields, o = {}) => Object.assign({ type: 'cards', key, label, fields }, o),
    more: (label, fields) => ({ type: 'more', label, fields }),
    h3: label => ({ type: 'h3', label }),
    hint: label => ({ type: 'hint', label })
  };

  const SECTIONS = [
    { id: 'basics', short: L('Building', 'Edificio'), title: L('The building', 'El edificio'),
      intro: L('Start here. These details identify the building.', 'Empiece por acá. Estos datos identifican el edificio.'),
      fields: [
        f.text('buildingName', L('Building name', 'Nombre del edificio'), { required: true, placeholder: L('Torre Mirador', 'Torre Mirador') }),
        f.text('contactName', L('Primary contact name', 'Nombre del contacto principal')),
        f.text('contactEmail', L('Primary contact email', 'Correo del contacto principal'), { inputType: 'email' }),
        f.select('defaultLanguage', L('Main language of the building', 'Idioma principal del edificio'), LANG_OPTIONS,
          { blank: L('Choose a language', 'Elija un idioma'), hint: L('Each resident can still choose their own language.', 'Cada residente puede elegir igual su propio idioma.') })
      ] },

    { id: 'people', short: L('People', 'Personas'), title: L('Staff and residents', 'Personal y residentes'),
      intro: L('Add the people who manage the building and, if you already have them, the residents. Everything can be completed later.',
               'Agregue a las personas que administran el edificio y, si ya los tiene, a los residentes. Todo se puede completar más adelante.'),
      fields: [
        f.table('staff', L('Staff', 'Personal'), [
          { key: 'name', label: L('Name', 'Nombre'), placeholder: L('Full name', 'Nombre completo') },
          { key: 'email', label: L('Email', 'Correo'), inputType: 'email' },
          { key: 'phone', label: L('Phone', 'Teléfono'), inputType: 'tel' },
          { key: 'role', label: L('Role', 'Cargo'), type: 'select', options: ROLE_OPTIONS, blank: L('Choose a role', 'Elija un cargo') },
          { key: 'language', label: L('Language', 'Idioma'), type: 'select', options: LANG_OPTIONS, blank: L('Language', 'Idioma') }
        ], { addLabel: L('Add a person', 'Agregar una persona'),
             hint: L('Each person receives an invitation to the staff app by email. The role sets what they can do.', 'Cada persona recibe una invitación a la app del personal por correo. El cargo define qué puede hacer.') }),
        f.table('residents', L('Residents', 'Residentes'), [
          { key: 'unit', label: L('Unit', 'Unidad'), placeholder: '1001' },
          { key: 'name', label: L('Name', 'Nombre'), placeholder: L('Full name', 'Nombre completo') },
          { key: 'email', label: L('Email', 'Correo'), inputType: 'email' },
          { key: 'phone', label: L('Phone', 'Teléfono'), inputType: 'tel' },
          { key: 'language', label: L('Language', 'Idioma'), type: 'select', options: LANG_OPTIONS, blank: L('Language', 'Idioma') }
        ], { addLabel: L('Add a resident', 'Agregar un residente'), paste: true,
             hint: L('Residents receive an invitation to the app. If you do not have all the emails yet, staff can invite them one by one later.', 'Los residentes reciben una invitación a la app. Si todavía no tiene todos los correos, el personal puede invitarlos de a uno más adelante.') })
      ] },

    { id: 'structure', short: L('Structure', 'Estructura'), title: L('Structure and technology', 'Estructura y tecnología'),
      intro: L('Tell us how the building is organized and what equipment it has, so we can set up the right groups and connections.',
               'Cuéntenos cómo está organizado el edificio y qué equipos tiene, para configurar los grupos y las conexiones correctas.'),
      fields: [
        f.text('totalUnits', L('Total number of units', 'Cantidad total de unidades'), { inputType: 'number' }),
        f.chips('unitSystem', L('Unit system', 'Sistema de medidas'), [['metric', L('Metric', 'Métrico')], ['imperial', L('Imperial', 'Imperial')]]),
        f.table('structure', L('Towers, wings and zones', 'Torres, alas y zonas'), [
          { key: 'name', label: L('Name', 'Nombre'), placeholder: L('Tower A', 'Torre A') },
          { key: 'kind', label: L('Type', 'Tipo'), type: 'select', options: [['tower', L('Tower', 'Torre')], ['wing', L('Wing', 'Ala')], ['block', L('Block', 'Bloque')], ['elevator', L('Elevator zone', 'Zona de ascensores')], ['other', L('Other', 'Otro')]], blank: L('Type', 'Tipo') },
          { key: 'floors', label: L('Floors', 'Pisos'), inputType: 'number' },
          { key: 'units', label: L('Units', 'Unidades'), inputType: 'number' }
        ], { addLabel: L('Add a row', 'Agregar una fila'),
             hint: L('One row for each tower, wing, block or elevator zone. For a single building, one row is enough.', 'Una fila por cada torre, ala, bloque o zona de ascensores. Si es un solo edificio, alcanza con una fila.') }),
        f.table('noticeGroups', L('Groups for notices', 'Grupos para avisos'), [
          { key: 'name', label: L('Group', 'Grupo'), placeholder: L('2nd floor', 'Segundo piso') },
          { key: 'units', label: L('Which units', 'Qué unidades'), placeholder: L('201 to 210', '201 al 210') }
        ], { addLabel: L('Add a group', 'Agregar un grupo'),
             hint: L('Groups that can receive a notice together, such as "2nd floor", "units served by elevator B" or "Tower 2".', 'Grupos que pueden recibir un aviso en conjunto, como "segundo piso", "unidades que usan el ascensor B" o "Torre 2".') }),
        f.area('structureNotes', L('Anything else about the layout', 'Algo más sobre la distribución')),
        f.h3(L('Equipment', 'Equipamiento')),
        f.chips('hasAutomation', L('Home automation in the building or the units', 'Domótica en el edificio o en las unidades'), YES_NO_UNSURE, { rerender: true }),
        f.text('automation', L('Brand and model', 'Marca y modelo'), { showIf: o => o.hasAutomation === 'yes' }),
        f.chips('hasAccess', L('Access control (doors, gates, turnstiles, card or code readers)', 'Control de acceso (puertas, portones, molinetes, lectores de tarjeta o código)'), YES_NO_UNSURE, { rerender: true }),
        f.text('locks', L('Brand and model', 'Marca y modelo'), { showIf: o => o.hasAccess === 'yes' }),
        f.chips('locksIntegration', L('Should Mirigi connect to it?', '¿Debe Mirigi conectarse con el sistema?'), [['yes', L('Yes', 'Sí')], ['no', L('No', 'No')], ['undecided', L('Not decided', 'Sin decidir')]],
          { showIf: o => o.hasAccess === 'yes', hint: L('Depending on the system, residents and staff can open doors and gates from the app.', 'Según el sistema, los residentes y el personal pueden abrir puertas y portones desde la app.') })
      ] },

    { id: 'services', short: L('Services', 'Servicios'), title: L('Daily services', 'Servicios diarios'),
      intro: L('How packages, reservations and requests work in the building.', 'Cómo funcionan en el edificio los paquetes, las reservas y las solicitudes.'),
      fields: [
        f.h3(L('Packages and deliveries', 'Paquetes y entregas')),
        f.table('receiving', L('Where packages arrive', 'Dónde llegan los paquetes'), [
          { key: 'name', label: L('Place', 'Lugar'), placeholder: L('Main lobby', 'Hall principal') },
          { key: 'kind', label: L('Type', 'Tipo'), type: 'select', options: [['room', L('Room', 'Sala')], ['lockers', L('Lockers', 'Casilleros')], ['desk', L('Front desk', 'Recepción')]], blank: L('Type', 'Tipo') }
        ], { addLabel: L('Add a place', 'Agregar un lugar') }),
        f.chips('couriers', L('Common couriers', 'Empresas de mensajería habituales'), COURIER_OPTIONS, { multi: true }),
        f.text('courierOther', L('Other couriers', 'Otras empresas')),
        f.sw('packageSignature', L('The resident signs when picking up a package', 'El residente firma al retirar un paquete')),
        f.sw('packagePhoto', L('Attach a photo when registering a package', 'Adjuntar una foto al registrar un paquete')),

        f.h3(L('Reservations', 'Reservas')),
        f.hint(L('Add one card for each space residents can reserve, such as the gym, party room, barbecue or pool.', 'Agregue una ficha por cada espacio que los residentes pueden reservar, como el gimnasio, el salón de fiestas, la parrilla o la piscina.')),
        f.cards('amenities', L('Spaces', 'Espacios'), [
          f.text('name', L('Name', 'Nombre'), { placeholder: L('Gym', 'Gimnasio') }),
          f.area('description', L('Description', 'Descripción'), { rows: 2 }),
          { type: 'grid', fields: [
            f.text('minDays', L('Minimum days ahead', 'Días mínimos de anticipación'), { inputType: 'number' }),
            f.text('maxDays', L('Maximum days ahead', 'Días máximos de anticipación'), { inputType: 'number' }),
            f.text('perDay', L('Reservations per day', 'Reservas por día'), { inputType: 'number' }),

  // ---------- State and rendering ----------
  let state = {};
  let uid = 0;
  const nextId = () => 'f' + (++uid);
  const form = document.querySelector('#signupForm');
  const statusEl = document.querySelector('#status');
  const linkButton = document.querySelector('#linkButton');
  const endpoint = (document.querySelector('meta[name="mirigi-signup-endpoint"]') || {}).content || '';

  const hasValue = v => Array.isArray(v) ? v.some(hasValue)
    : (v && typeof v === 'object') ? Object.values(v).some(hasValue)
    : v === true || typeof v === 'number' || (typeof v === 'string' && v.trim() !== '');

  function el(tag, props, ...kids) {
    const n = document.createElement(tag);
    if (props) Object.entries(props).forEach(([k, v]) => {
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (v === true) n.setAttribute(k, '');
      else if (v !== false && v != null) n.setAttribute(k, v);
    });
    kids.flat().forEach(c => { if (c != null) n.append(c); });
    return n;
  }
  const rowsOf = (obj, fd) => { if (!Array.isArray(obj[fd.key]) || !obj[fd.key].length) obj[fd.key] = [{}]; return obj[fd.key]; };
  let dotsQueued = false;
  function changed() { if (dotsQueued) return; dotsQueued = true; requestAnimationFrame(() => { dotsQueued = false; updateDots(); }); }

  function control(fd, obj) {
    let c;
    if (fd.type === 'select') {
      c = el('select');
      c.append(el('option', { value: '', text: T(fd.blank || CHROME.choose) }));
      fd.options.forEach(([v, label]) => c.append(el('option', { value: v, text: T(label) })));
      c.value = obj[fd.key] || '';
      c.addEventListener('change', () => { obj[fd.key] = c.value; changed(); });
    } else if (fd.type === 'textarea') {
      c = el('textarea', { rows: fd.rows || 3, placeholder: T(fd.placeholder || '') });
      c.value = obj[fd.key] || '';
      c.addEventListener('input', () => { obj[fd.key] = c.value; changed(); });
    } else {
      c = el('input', { type: fd.inputType || 'text', placeholder: T(fd.placeholder || ''), required: !!fd.required });
      if (fd.inputType === 'number') { c.setAttribute('min', '0'); c.setAttribute('inputmode', 'numeric'); }
      c.value = obj[fd.key] || '';
      c.addEventListener('input', () => { obj[fd.key] = c.value; changed(); });
    }
    if (fd.key === 'buildingName') c.id = 'buildingName';
    return c;
  }
  const hintOf = fd => fd.hint ? el('p', { class: 'hint', text: T(fd.hint) }) : null;

  function renderInput(fd, obj) {
    const c = control(fd, obj); c.id = c.id || nextId();
    return el('div', { class: 'field' }, el('label', { for: c.id }, T(fd.label), fd.required ? el('span', { class: 'req', text: ' *' }) : null), c, hintOf(fd));
  }
  function renderChips(fd, obj) {
    const name = nextId();
    const wrap = el('div', { class: 'chips', role: fd.multi ? 'group' : 'radiogroup', 'aria-label': T(fd.label) });
    fd.options.forEach(([v, label]) => {
      const input = el('input', { type: fd.multi ? 'checkbox' : 'radio', name, value: v });
      input.checked = fd.multi ? (obj[fd.key] || []).includes(v) : obj[fd.key] === v;
      input.addEventListener('change', () => {
        if (fd.multi) { const cur = new Set(obj[fd.key] || []); if (input.checked) cur.add(v); else cur.delete(v); obj[fd.key] = [...cur]; }
        else obj[fd.key] = v;
        changed(); if (fd.rerender) renderAll();
      });
      wrap.append(el('label', { class: 'chip' }, input, el('span', { text: T(label) })));
    });
    return el('div', { class: 'field' }, el('span', { class: 'label', text: T(fd.label) }), wrap, hintOf(fd));
  }
  function renderSwitch(fd, obj) {
    const input = el('input', { type: 'checkbox', role: 'switch' });
    input.checked = !!obj[fd.key];
    input.addEventListener('change', () => { obj[fd.key] = input.checked; changed(); if (fd.rerender) renderAll(); });
    return el('label', { class: 'switch-row' }, el('span', { class: 'txt', text: T(fd.label) }), el('span', { class: 'switch' }, input, el('span', { class: 'track' })));
  }
  const removeButton = onClick => {
    const x = el('button', { type: 'button', class: 'x', 'aria-label': T(CHROME.remove), title: T(CHROME.remove), text: '×' });
    x.addEventListener('click', onClick); return x;
  };

  const LANG_ALIASES = { en: 'en', english: 'en', 'inglés': 'en', ingles: 'en', es: 'es', spanish: 'es', 'español': 'es', espanol: 'es', pt: 'pt', portuguese: 'pt', 'portugués': 'pt', portugues: 'pt', 'português': 'pt', ru: 'ru', russian: 'ru', ruso: 'ru', 'русский': 'ru' };
  function importRows(text, rows) {
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    let added = 0;
    if (rows.every(r => !hasValue(r))) rows.length = 0;
    lines.forEach((line, i) => {
      const cells = (line.includes('\t') ? line.split('\t') : line.split(/[;,]/)).map(c => c.trim());
      if (i === 0 && /^(unit|unidad)$/i.test(cells[0])) return;
      rows.push({ unit: cells[0] || '', name: cells[1] || '', email: cells[2] || '', phone: cells[3] || '', language: LANG_ALIASES[(cells[4] || '').toLowerCase()] || '' });
      added++;
    });
    return added;
  }
  function renderPaste(fd, obj, rebuild) {
    const ta = el('textarea', { rows: 4, placeholder: 'A-101\tJane Doe\tjane@example.com\t+1 555 0100\ten' });
    const btn = el('button', { type: 'button', class: 'add', 'data-paste': fd.key, text: T(CHROME.pasteButton) });
    btn.addEventListener('click', () => { const n = importRows(ta.value, rowsOf(obj, fd)); if (n) { ta.value = ''; changed(); rebuild(); say('pasted', ' ' + n); } });
    return el('details', { class: 'more' }, el('summary', { text: T(CHROME.paste) }), el('p', { class: 'hint', text: T(CHROME.pasteHint) }), ta, btn);
  }

  function renderTable(fd, obj) {
    const box = el('div', { class: 'field' });

      box.textContent = '';
      const rows = rowsOf(obj, fd);
      box.append(el('span', { class: 'label', text: T(fd.label) }));
      if (fd.hint) box.append(hintOf(fd));
      const head = el('tr', null, fd.columns.map(c => el('th', { text: T(c.label) })), el('th', { class: 'act' }));
      const body = el('tbody');
      rows.forEach((row, i) => {
        const tr = el('tr');
        fd.columns.forEach(c => {
          const ctl = control(Object.assign({ type: 'text' }, c), row);
          ctl.setAttribute('aria-label', T(c.label));
          tr.append(el('td', { 'data-label': T(c.label) }, ctl));
        });
        tr.append(el('td', { class: 'act' }, removeButton(() => { rows.splice(i, 1); changed(); build(); })));
        body.append(tr);
      });
      box.append(el('div', { class: 'tblwrap' }, el('table', { class: 'tbl' }, el('thead', null, head), body)));
      const add = el('button', { type: 'button', class: 'add', 'data-add': fd.key, text: '+ ' + T(fd.addLabel) });
      add.addEventListener('click', () => {
        rows.push({}); build();
        const last = box.querySelector('tbody tr:last-child input, tbody tr:last-child select'); if (last) last.focus();
      });
      box.append(add);
      if (fd.paste) box.append(renderPaste(fd, obj, build));
    };
    build();
    return box;
  }
  function renderCards(fd, obj) {
    const box = el('div', { class: 'field' });
    const build = () => {
      box.textContent = '';
      const items = rowsOf(obj, fd);
      items.forEach((item, i) => {
        box.append(el('div', { class: 'item' },
          el('div', { class: 'item-head' }, el('span', { class: 'ttl', text: T(fd.itemTitle) + ' ' + (i + 1) }), removeButton(() => { items.splice(i, 1); changed(); build(); })),
          fd.fields.map(sub => renderField(sub, item))));
      });
      const add = el('button', { type: 'button', class: 'add', 'data-add': fd.key, text: '+ ' + T(fd.addLabel) });
      add.addEventListener('click', () => { items.push({}); build(); });
      box.append(add);
    };
    build();
    return box;
  }
  function renderModules() {
    const grid = el('div', { class: 'modules' });
    MODULES.forEach(m => {
      const on = !!state[m.key + '.on'];
      const input = el('input', { type: 'checkbox', role: 'switch', 'aria-label': T(CHROME.on) + ': ' + T(m.title), 'data-module-switch': m.key });
      input.checked = on;
      input.addEventListener('change', () => { state[m.key + '.on'] = input.checked; changed(); renderAll(); });
      const info = el('button', { type: 'button', class: 'info', 'aria-expanded': 'false', 'aria-label': T(CHROME.moreInfo) + ': ' + T(m.title), title: T(CHROME.moreInfo), text: 'i' });
      const pop = el('div', { class: 'info-pop', hidden: true, text: T(m.info) });
      info.addEventListener('click', () => { const open = pop.hidden; pop.hidden = !open; info.setAttribute('aria-expanded', String(open)); });
      const ico = el('span', { class: 'ico' });
      ico.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[m.icon] + '</svg>';
      grid.append(el('div', { class: 'module' + (on ? ' on' : ''), 'data-module': m.key },
        el('div', { class: 'module-head' }, ico, el('span', { class: 'name', text: T(m.title) }), info, el('span', { class: 'switch' }, input, el('span', { class: 'track' }))),
        pop,
        on ? el('div', { class: 'module-body' }, m.fields.map(fd => renderField(fd, state))) : null));
    });
    return grid;
  }
  function renderField(fd, obj) {
    if (fd.showIf && !fd.showIf(obj)) return null;
    switch (fd.type) {
      case 'h3': return el('h3', { text: T(fd.label) });
      case 'hint': return el('p', { class: 'hint', text: T(fd.label) });
      case 'grid': return el('div', { class: 'grid' }, fd.fields.map(x => renderField(x, obj)));
      case 'text': case 'textarea': case 'select': return renderInput(fd, obj);
      case 'chips': return renderChips(fd, obj);
      case 'switch': return renderSwitch(fd, obj);
      case 'table': return renderTable(fd, obj);
      case 'cards': return renderCards(fd, obj);
      case 'more': return el('details', { class: 'more' }, el('summary', { text: T(fd.label) }), fd.fields.map(x => renderField(x, obj)));
      case 'modules': return renderModules();
      default: return null;
    }
  }

  // Which state keys belong to a section: used to mark a section as started.
  function keysOf(fd, out) {
    if (fd.type === 'modules') MODULES.forEach(m => out.push(m.key + '.on'));
    else if (fd.type === 'grid' || fd.type === 'more') fd.fields.forEach(x => keysOf(x, out));
    else if (fd.key) out.push(fd.key);
    return out;
  }
  function updateDots() {
    SECTIONS.forEach(sec => {
      const a = document.querySelector('#stepper a[data-sec="' + sec.id + '"]');
      if (a) a.classList.toggle('done', sec.fields.reduce((k, fd) => keysOf(fd, k), []).some(k => hasValue(state[k])));
    });
  }

  function chrome() {
    document.documentElement.lang = lang;
    document.querySelector('.signup').dataset.lang = lang;
    document.querySelector('#pageTitle').textContent = T(CHROME.title);
    document.querySelector('#pageLead').textContent = T(CHROME.lead);
    document.querySelector('#privacyNote').textContent = T(CHROME.privacy);
    document.querySelector('#saveButton').textContent = T(CHROME.save);
    document.querySelector('#sendButton').textContent = T(CHROME.send);
    linkButton.textContent = T(CHROME.link);
    document.querySelector('.langswitch').setAttribute('aria-label', T(CHROME.langGroup));
    document.querySelectorAll('.langswitch button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    const stepper = document.querySelector('#stepper');
    stepper.setAttribute('aria-label', T(CHROME.sections));
    stepper.textContent = '';
    SECTIONS.forEach((sec, i) => stepper.append(el('a', { href: '#sec-' + sec.id, 'data-sec': sec.id }, el('span', { class: 'dot' }), String(i + 1) + '. ' + T(sec.short))));
  }
  function renderAll() {
    const y = window.scrollY;
    uid = 0;
    const root = document.querySelector('#formRoot');
    root.textContent = '';
    SECTIONS.forEach((sec, i) => root.append(el('section', { class: 'card', id: 'sec-' + sec.id },
      el('span', { class: 'num', text: String(i + 1).padStart(2, '0') + ' / ' + T(sec.short).toUpperCase() }),
      el('h2', { text: T(sec.title) }), el('p', { class: 'intro', text: T(sec.intro) }),
      sec.fields.map(fd => renderField(fd, state)))));
    chrome(); updateDots(); renderVersions();
    window.scrollTo(0, y);
  }
  document.addEventListener('click', e => { if (!e.target.closest('.info, .info-pop')) document.querySelectorAll('.info[aria-expanded="true"]').forEach(b => b.click()); });

  // ---------- What gets saved ----------
  function snapshot() {
    const copy = JSON.parse(JSON.stringify(state));
    Object.keys(copy).forEach(k => {
      const v = copy[k];
      if (Array.isArray(v) && v.length && typeof v[0] === 'object') { copy[k] = v.filter(hasValue); if (!copy[k].length) delete copy[k]; }
    });
    MODULES.forEach(m => { if (!copy[m.key + '.on']) Object.keys(copy).forEach(k => { if (k.startsWith(m.key + '.') && k !== m.key + '.on') delete copy[k]; }); });
    copy.formLanguage = lang;
    return copy;
  }
  function restoreData(d) { state = JSON.parse(JSON.stringify(d || {})); delete state.formLanguage; renderAll(); }

  // ---------- Messages ----------
  const MSG = {
    storage_fail: L('This browser could not store the version. Press Send setup to keep your answers.', 'Este navegador no pudo guardar la versión. Presione Enviar configuración para conservar sus respuestas.'),
    saved_local: L('Version saved on this device.', 'Versión guardada en este dispositivo.'),
    saved_pending: L('Saved on this device. It is not backed up yet and will be retried.', 'Guardada en este dispositivo. Todavía no tiene respaldo y se va a reintentar.'),
    saved_ok: L('Version saved and backed up.', 'Versión guardada y respaldada.'),
    submit_noendpoint: L('The form is not connected yet. Your version is saved on this device.', 'El formulario todavía no está conectado. Su versión quedó guardada en este dispositivo.'),
    submit_fail: L('Could not send yet. Your version is saved on this device and will be retried.', 'No se pudo enviar todavía. Su versión quedó guardada en este dispositivo y se va a reintentar.'),
    submit_ok: L('Setup sent successfully. Thank you.', 'Configuración enviada. Muchas gracias.'),
    loading: L('Loading your setup…', 'Cargando su configuración…'),
    loaded_latest: L('Loaded the latest saved version.', 'Se cargó la última versión guardada.'),
    load_fail: L('Could not load that setup. Check the link or try again.', 'No se pudo cargar esa configuración. Revise el enlace o intente de nuevo.'),
    loaded_last_local: L('Your last saved version was loaded.', 'Se cargó su última versión guardada.'),
    version_loaded: L('Version loaded.', 'Versión cargada.'),
    link_first: L('Press Save progress first. The link works once a version is backed up.', 'Primero presione Guardar avance. El enlace funciona cuando hay una versión respaldada.'),
    link_copied: L('Link copied. Anyone with it can open and change this setup, so keep it private.', 'Enlace copiado. Cualquiera que lo tenga puede abrir y modificar esta configuración, así que manténgalo privado.'),
    link_copy: L('Copy this private link: ', 'Copie este enlace privado: '),
    load_version: L('Load version', 'Cargar versión'),
    not_backed_up: L(', not backed up', ', sin respaldo'),
    pasted: L('Rows added:', 'Filas agregadas:')
  };
  let lastStatus = null;
  const msg = key => T(MSG[key]);
  function say(key, extra) { lastStatus = [key, extra]; statusEl.textContent = msg(key) + (extra || ''); }

  // ---------- Draft id and the versions kept in this browser ----------
  const draftKey = 'mirigi-building-signup-draft-v3';
  const versionsKeyPrefix = 'mirigi-building-signup-v3:';
  const langKey = 'mirigi-building-signup-lang-v1';
  const MAX_LOCAL = 50;
  function newId() { return crypto.randomUUID ? crypto.randomUUID() : Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join(''); }
  function stored(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  const linkId = (location.hash.match(/^#d=([A-Za-z0-9-]{20,64})$/) || [])[1] || '';
  let draftId = linkId || stored(draftKey) || newId();
  try { localStorage.setItem(draftKey, draftId); } catch (e) { /* storage blocked */ }
  if (linkId) history.replaceState(null, '', location.pathname + location.search);

  const versionsKey = () => versionsKeyPrefix + draftId;
  function versions() { try { const v = JSON.parse(stored(versionsKey()) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
  function setVersions(all) {
    const keep = all.filter((v, i) => !v.synced || i >= all.length - MAX_LOCAL);
    try { localStorage.setItem(versionsKey(), JSON.stringify(keep)); } catch (e) { say('storage_fail'); }
  }
  function markSynced(savedAt, event, serverVersion) {
    const all = versions(); const v = all.find(x => x.savedAt === savedAt && (x.event || 'save') === event);
    if (v) { v.synced = true; v.serverVersion = serverVersion; setVersions(all); }
  }
  function renderVersions() {
    document.querySelector('#savedVersions').innerHTML = versions().map((v, i) => '<button type="button" class="secondary" data-load="' + i + '">' + msg('load_version') + ' ' + (i + 1) + ' (' + new Date(v.savedAt).toLocaleString() + ')' + (endpoint && !v.synced ? msg('not_backed_up') : '') + '</button>').join('');
  }

  // ---------- Backup to the spreadsheet (versions not yet backed up, oldest first) ----------
  async function post(body) {
    const res = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
    const json = await res.json().catch(() => null);
    if (!res.ok || !json || json.ok !== true) throw new Error((json && json.error) || 'HTTP ' + res.status);
    return json;
  }
  let syncing = null;
  async function sync() {
    if (!endpoint) return { error: null };
    if (syncing) return syncing;
    syncing = (async () => {
      const tried = new Set();
      for (;;) {
        const next = versions().find(v => !v.synced && !tried.has(v.savedAt + (v.event || 'save')));
        if (!next) return { error: null };
        tried.add(next.savedAt + (next.event || 'save'));
        try { const r = await post({ draftId, event: next.event || 'save', savedAt: next.savedAt, data: next.data, company_url: form.elements.company_url.value }); markSynced(next.savedAt, next.event || 'save', r.version); }
        catch (error) { return { error }; }
      }
    })();
    try { return await syncing; } finally { syncing = null; renderVersions(); }
  }

  async function save(event) {
    const all = versions(); all.push({ savedAt: new Date().toISOString(), event, data: snapshot(), synced: false }); setVersions(all); renderVersions();
    const result = await sync();
    if (event === 'submit') {
      if (!endpoint) say('submit_noendpoint');
      else if (result.error) say('submit_fail');
      else say('submit_ok');
    } else if (!endpoint) say('saved_local');
    else if (result.error) say('saved_pending');
    else say('saved_ok');
  }
  function loadLocal(i) { const d = versions()[i]; if (!d) return false; restoreData(d.data); return true; }
  async function resumeFromLink() {
    say('loading');
    try {
      const res = await fetch(endpoint + '?action=latest&d=' + encodeURIComponent(draftId));
      const json = await res.json();
      if (!json || json.ok !== true) throw new Error((json && json.error) || 'HTTP ' + res.status);
      restoreData(json.data);
      const all = versions(); all.push({ savedAt: json.savedAt, event: json.event || 'save', data: json.data, synced: true, serverVersion: json.version }); setVersions(all);
      say('loaded_latest');
      return true;
    } catch (e) { say('load_fail'); return false; }
  }

  function setLang(next, remember) {
    lang = next === 'es' ? 'es' : 'en';
    if (remember) { try { localStorage.setItem(langKey, lang); } catch (e) { /* storage blocked */ } }
    renderAll();
    if (lastStatus) say(lastStatus[0], lastStatus[1]);
  }

  document.querySelectorAll('.langswitch button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang, true)));
  document.querySelector('#saveButton').addEventListener('click', () => save('save'));
  document.querySelector('#savedVersions').addEventListener('click', e => { if (e.target.dataset.load !== undefined && loadLocal(Number(e.target.dataset.load))) say('version_loaded'); });
  form.addEventListener('submit', e => { e.preventDefault(); if (!form.reportValidity()) return; save('submit'); });
  linkButton.addEventListener('click', async () => {
    if (!versions().some(v => v.synced)) return say('link_first');
    const url = location.origin + location.pathname + (lang === 'es' ? '?lang=es' : '') + '#d=' + draftId;
    try { await navigator.clipboard.writeText(url); say('link_copied'); }
    catch (e) { say('link_copy', url); }
  });
  window.addEventListener('online', () => { sync(); });

  (async function boot() {
    const fromUrl = new URLSearchParams(location.search).get('lang');
    lang = fromUrl === 'es' || fromUrl === 'en' ? fromUrl : (stored(langKey) || ((navigator.language || '').toLowerCase().startsWith('es') ? 'es' : 'en'));
    if (fromUrl) { try { localStorage.setItem(langKey, lang); } catch (e) { /* storage blocked */ } }
    renderAll();
    linkButton.hidden = !endpoint;
    const hasPending = versions().some(v => !v.synced);
    let loaded = false;
    if (linkId && endpoint && !hasPending) loaded = await resumeFromLink();
    if (!loaded && versions().length && loadLocal(versions().length - 1)) say('loaded_last_local');
    sync();
  })();
})();
</script>
