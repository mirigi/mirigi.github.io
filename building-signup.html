<script>
(async function () {
  var lock = document.getElementById('lock');
  function locked() { lock.hidden = false; }
  function bytes(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/'); s += '='.repeat((4 - s.length % 4) % 4);
    return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); });
  }
  try {
    var token = new URLSearchParams(location.hash.slice(1)).get('project');
    if (!token) {
      var q = new URLSearchParams(location.search).get('project');
      if (q) { token = q; history.replaceState(null, '', location.pathname + '#project=' + q + (location.hash ? '&' + location.hash.slice(1) : '')); }
    }
    if (!token) return locked();
    var raw = bytes(token);
    if (raw.length < 50 || raw[0] !== 1) return locked();
    var key = await crypto.subtle.importKey('raw', raw.slice(1, 33), 'AES-GCM', false, ['decrypt']);
    var blob = JSON.parse(document.getElementById('blob').textContent);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(blob.iv) }, key, bytes(blob.ct));
    var name = new TextDecoder().decode(raw.slice(49));
    var tag = btoa(String.fromCharCode.apply(null, raw.slice(33, 49))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    var auth = name + '.' + tag;
    window.__MIRIGI_ACCESS = { auth: auth };
    // document.open() is ignored while the browser is still parsing this page, so wait for it to finish.
    if (document.readyState !== 'complete') await new Promise(function (r) { window.addEventListener('load', r, { once: true }); });
    document.open(); document.write(new TextDecoder().decode(plain)); document.close();
  } catch (e) { locked(); }
})();
</script>
